<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <circle cx="1000" cy="300" r="380" fill="url(#glow)"/>

  <!-- subtle grid texture -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
  </g>

  <!-- Logo lockup: link + image icon -->
  <g transform="translate(80, 92)">
    <rect width="88" height="88" rx="20" fill="url(#iconGrad)"/>
    <rect x="16" y="16" width="56" height="56" rx="8" fill="none" stroke="#ffffff" stroke-width="4.5"/>
    <circle cx="34" cy="36" r="6" fill="#ffffff"/>
    <path d="M20 62 L40 42 L52 54 L68 38 L68 66 L20 66 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M50 24 a8 8 0 0 1 8 -8 h6 a8 8 0 0 1 0 16 h-3" stroke="#0f172a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M64 30 a8 8 0 0 1 -8 8 h-6 a8 8 0 0 1 0 -16 h3" stroke="#0f172a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <text x="188" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">URL <tspan fill="#f59e0b">Image Uploader</tspan></text>
  <text x="188" y="164" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#fbbf24">for FilamentPHP</text>

  <!-- Tagline -->
  <text x="80" y="260" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#f1f5f9">Upload a file, or just</text>
  <text x="80" y="308" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#f1f5f9">paste an image URL</text>

  <!-- Feature list -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">
    <g transform="translate(80, 368)">
      <circle cx="6" cy="-6" r="4" fill="#f59e0b"/>
      <text x="22" y="0">Two-tab field: direct upload or fetch-from-URL</text>
    </g>
    <g transform="translate(80, 406)">
      <circle cx="6" cy="-6" r="4" fill="#f59e0b"/>
      <text x="22" y="0">Content-type checked, size-capped server-side fetch</text>
    </g>
    <g transform="translate(80, 444)">
      <circle cx="6" cy="-6" r="4" fill="#f59e0b"/>
      <text x="22" y="0">Plain storage-path string - no accessor gymnastics</text>
    </g>
    <g transform="translate(80, 482)">
      <circle cx="6" cy="-6" r="4" fill="#f59e0b"/>
      <text x="22" y="0">Configurable disk, directory &amp; filename handling</text>
    </g>
  </g>

  <!-- Right-side visual: field mockup card -->
  <g transform="translate(760, 260)">
    <rect width="440" height="260" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <!-- tabs -->
    <rect x="20" y="20" width="130" height="34" rx="8" fill="url(#cardGrad)"/>
    <text x="85" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Upload File</text>
    <rect x="160" y="20" width="130" height="34" rx="8" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="225" y="42" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">From URL</text>

    <!-- dropzone -->
    <rect x="20" y="72" width="400" height="130" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
    <g transform="translate(200,120)">
      <circle r="26" fill="url(#iconGrad)"/>
      <path d="M-10 6 L0 -8 L10 6 Z" fill="#ffffff"/>
      <rect x="-3" y="6" width="6" height="8" fill="#ffffff"/>
    </g>
    <text x="220" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Drag &amp; drop or paste an image URL</text>

    <!-- input bar -->
    <rect x="20" y="216" width="300" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="32" y="235" font-family="monospace" font-size="12" fill="#64748b">https://example.com/photo.jpg</text>
    <rect x="332" y="216" width="88" height="28" rx="6" fill="url(#cardGrad)"/>
    <text x="376" y="235" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Fetch</text>
  </g>

  <!-- badges -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#64748b" transform="translate(80, 560)">
    <text x="0" y="0">Filament 3.x</text>
    <circle cx="112" cy="-5" r="2.5" fill="#475569"/>
    <text x="124" y="0">PHP 8.2+</text>
    <circle cx="216" cy="-5" r="2.5" fill="#475569"/>
    <text x="228" y="0">MIT Licensed</text>
  </g>
</svg>
